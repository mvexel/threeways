# Production Docker Compose configuration

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-threeways}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-threeways}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD}
      PGSCHEMA: ${PGSCHEMA:-osm}
      OSM_REGION: ${OSM_REGION:-utah}
      PIPELINE_FLEX_FILE: /workspace/osm2pgsql/poi_age.lua
      # R2/S3 credentials for tile upload
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
    volumes:
      - ./data/osm:/data/osm
      - ./data/tiles:/data/tiles
      - ./data/logs:/data/logs
    # Pipeline runs on schedule via Dokploy or cron
    profiles:
      - scheduled

volumes:
  postgres_data:
