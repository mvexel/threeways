# Hetzner staging with Dokploy-managed secrets

services:
  db:
    build:
      context: .
      dockerfile: docker/postgis/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-threeways}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}" ]
      interval: 30s
      timeout: 10s
      retries: 3

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-threeways}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD}
      PGSCHEMA: ${PGSCHEMA:-osm}
      OSM_REGION: ${OSM_REGION:-utah}
      PIPELINE_FLEX_FILE: /workspace/osm2pgsql/poi_age.lua
    volumes:
      - ./data/osm:/data/osm
      - ./data/tiles:/data/tiles
      - ./data/logs:/data/logs
    profiles:
      - scheduled

volumes:
  postgres_data:
